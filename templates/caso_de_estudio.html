<!-- templates/caso_de_estudio.html (Versión Corregida) -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ caso.titulo }} - Caso de Estudio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('home') }}">Volver al Portafolio</a> <!-- Cambiado 'index' a 'home' que es el nombre de la función en Flask -->
        </nav>
    </header>
    <main class="caso-detalle-container">
        <h1>{{ caso.titulo }}</h1>
        <p><strong>Cliente:</strong> {{ caso.cliente }}</p>
        
        <!-- (CORREGIDO) Bucle para mostrar todas las imágenes -->
        <div class="caso-imagenes-grid">
            {% for imagen in caso.imagenes %}
            <img src="{{ url_for('static', filename='img/' + imagen) }}" alt="Gráfico de resultados para {{ caso.cliente }}" class="caso-imagen">
            {% endfor %}
        </div>
        
        <h2>El Desafío</h2>
        <p>{{ caso.problema }}</p>
        
        <h2>La Solución</h2>
        <p>{{ caso.solucion }}</p>
        
        <h2>El Resultado</h2>
        <p>{{ caso.resultado }}</p>
        
        <a href="{{ url_for('home') }}#agendar-cita" class="btn">¿Quieres resultados similares? ¡Hablemos!</a>
    </main>
</body>
</html>
