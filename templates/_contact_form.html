<!-- Contenido para: templates/_contact_form.html (CON ESTILOS MEJORADOS) -->
<div class="contact-wrapper" style="max-width: 600px; margin: 0 auto; text-align: left;">
    <div class="section-heading" style="text-align: center; margin-bottom: 2rem;">
        <h2>{{ _('Envíame un mensaje') }}</h2>
        <p>{{ _('Rellena el formulario y daré respuesta a tu consulta dentro de las próximas 24 horas.') }}</p>
    </div>
    
    <!-- La clase 'form' del nuevo diseño aplica el 'display: grid' y el 'gap' -->
    <form id="contact-form" action="{{ url_for('enviar_mensaje') }}" method="POST" class="form">
        <input type="hidden" name="lang_code" value="{{ g.lang_code }}">
        
        <!-- (CORREGIDO) Añadida la clase 'input' a cada campo -->
        <input type="text" name="nombre" placeholder="{{ _('Nombre') }}" required class="input">
        
        <input type="email" name="email" placeholder="{{ _('Email') }}" required class="input">
        
        <select name="pack_interes" required class="input">
            <option value="" disabled selected>{{ _('Servicio de interés...') }}</option>
            {% for pack_item in packs.proyectos %}
                <option value="{{ pack_item }}">{{ _(pack_item) }}</option>
            {% endfor %}
            {% for pack_item in packs.horas %}
                <option value="{{ pack_item.nombre }}">{{ _(pack_item.nombre) }}</option>
            {% endfor %}
        </select>

        <textarea name="notas" rows="5" placeholder="{{ _('Cuéntame más sobre tu proyecto...') }}" class="input"></textarea>

        <input type="hidden" id="recaptcha-response" name="g-recaptcha-response">
        
        <button type="submit" class="button" style="width: 100%;">{{ _('Enviar Mensaje') }}</button>
    </form>
</div>
