<!-- templates/caso_de_estudio.html (Versión Corregida) -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ caso.titulo }} - Caso de Estudio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- ========================================= -->
<!-- CÓDIGO DEL FAVICON ADAPTADO PARA FLASK    -->
<!-- ========================================= -->

<link rel="icon" type="image/png" sizes="96x96" href="{{ url_for('static', filename='favicons/favicon-96x96.png') }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicons/favicon.svg') }}">
<link rel="shortcut icon" href="{{ url_for('static', filename='favicons/favicon.ico') }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicons/apple-touch-icon.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='favicons/site.webmanifest') }}">

<!-- Opcional: añade estos para una mejor compatibilidad -->
<meta name="msapplication-TileColor" content="#ffffff"> <!-- Cambia #ffffff al color de fondo de tu logo -->
<meta name="theme-color" content="#ffffff"> <!-- Cambia #ffffff al color principal de tu tema -->
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('home') }}">Volver al Portafolio</a> <!-- Cambiado 'index' a 'home' que es el nombre de la función en Flask -->
        </nav>
    </header>
    <main class="caso-detalle-container">
        <h1>{{ caso.titulo }}</h1>
        <p><strong>Cliente:</strong> {{ caso.cliente }}</p>
        
        <!-- (CORREGIDO) Bucle para mostrar todas las imágenes -->
        <div class="caso-imagenes-grid">
            {% for imagen in caso.imagenes %}
            <img src="{{ url_for('static', filename='img/' + imagen) }}" alt="Gráfico de resultados para {{ caso.cliente }}" class="caso-imagen">
            {% endfor %}
        </div>
        
        <h2>El Desafío</h2>
        <p>{{ caso.problema }}</p>
        
        <h2>La Solución</h2>
        <p>{{ caso.solucion }}</p>
        
        <h2>El Resultado</h2>
        <p>{{ caso.resultado }}</p>
        
        <a href="{{ url_for('home') }}#agendar-cita" class="btn">¿Quieres resultados similares? ¡Hablemos!</a>
    </main>
</body>
</html>
